name: Build Windows app and installer

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Generate Windows app icon
        shell: pwsh
        run: ./scripts/generate-icon.ps1

      - name: Publish standalone app
        shell: pwsh
        run: |
          dotnet publish src/AnnoPlus/AnnoPlus.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
          if (!(Test-Path "publish/anno+.exe")) { throw "Standalone app was not produced." }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "publish/anno+.exe" "dist/anno+-portable.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer/anno-plus.iss"
          if (!(Test-Path "dist/anno+-setup.exe")) { throw "Installer was not produced." }

      - name: Package downloads
        shell: pwsh
        run: |
          @("anno+ Windows app", "", "Run anno+-portable.exe for the portable version.", "Run anno+-setup.exe to install anno+.", "Windows 10/11 x64. No .NET installation required.") | Set-Content dist/README-FIRST.txt
          Compress-Archive -Path dist/* -DestinationPath anno-plus-windows-x64.zip -Force

      - name: Upload build downloads
        uses: actions/upload-artifact@v4
        with:
          name: anno-plus-windows-x64
          path: |
            dist/anno+-portable.exe
            dist/anno+-setup.exe
            anno-plus-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/anno+-portable.exe
            dist/anno+-setup.exe
            anno-plus-windows-x64.zip
